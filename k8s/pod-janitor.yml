# Hand-authored (not kompose-generated).
#
# Reaps terminated pods in the `media` namespace. The single OrbStack node
# periodically hits ephemeral-storage DiskPressure and evicts pods; evicted
# pods stay in phase=Failed forever (k8s only GCs terminated pods past a
# cluster-wide 12500 threshold), so they pile up by the hundreds over time.
#
# We keep terminated pods for 7 days so recent failures are still around for
# debugging, then delete anything older. Runs daily.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-janitor
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-janitor
  namespace: media
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-janitor
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-janitor
subjects:
  - kind: ServiceAccount
    name: pod-janitor
    namespace: media
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-janitor
  namespace: media
spec:
  schedule: "0 4 * * *" # daily at 04:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: pod-janitor
          restartPolicy: OnFailure
          containers:
            - name: janitor
              image: bitnami/kubectl:latest
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  cutoff=$(( $(date -u +%s) - 7 * 86400 ))
                  deleted=0
                  kubectl get pods -n media -o go-template='{{range .items}}{{if or (eq .status.phase "Failed") (eq .status.phase "Succeeded")}}{{.metadata.name}} {{.metadata.creationTimestamp}}{{"\n"}}{{end}}{{end}}' \
                  | while read -r name ts; do
                      [ -z "$name" ] && continue
                      if [ "$(date -u -d "$ts" +%s)" -lt "$cutoff" ]; then
                        kubectl delete pod -n media "$name" --wait=false
                        deleted=$((deleted + 1))
                      fi
                    done
                  echo "pod-janitor: done"
