---
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert --out k8s
    kompose.version: 1.32.0 (HEAD)
  labels:
    io.kompose.service: tubesync
  name: tubesync
spec:
  ports:
    - name: "4848"
      port: 4848
      targetPort: 4848
  selector:
    io.kompose.service: tubesync

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --out k8s
    kompose.version: 1.32.0 (HEAD)
  labels:
    io.kompose.service: tubesync
  name: tubesync
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: tubesync
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --out k8s
        kompose.version: 1.32.0 (HEAD)
      labels:
        io.kompose.network/htpc-download-box-default: "true"
        io.kompose.service: tubesync
    spec:
      containers:
        - env:
            - name: PGID
            - name: PUID
            - name: TZ
            - name: TUBESYNC_WORKERS
              value: "6"
          image: ghcr.io/meeb/tubesync:latest
          name: tubesync
          volumeMounts:
            - mountPath: /config
              name: config
            - mountPath: /downloads
              name: downloads
      restartPolicy: Always
      volumes:
        - name: config
          hostPath:
            path: /mnt/mac/Users/segiddins/.config/tubesync
        - name: downloads
          hostPath:
            path: /mnt/mac/Volumes/Storage/Media/YouTube
